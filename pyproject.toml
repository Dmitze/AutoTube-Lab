[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytaimbot"
version = "0.1.0"
description = "YouTube AI Money Bot 2026 — autonomous trend analysis and content pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
