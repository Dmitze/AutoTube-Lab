[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytaimbot"
version = "0.1.0"
description = "YouTube AI Money Bot 2026 — autonomous trend analysis and content pipeline"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # Phase 1: Trend Adapters
    "httpx>=0.27,<1.0",
    "trendspy>=0.1.4",
    "google-api-python-client>=2.120,<3.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.29.0",
    # Phase 2: LLM + TTS
    "groq>=0.8.0",
    "edge-tts>=6.1.9",
    "pydub>=0.25.1",
    "prometheus-client>=0.19",
    "moviepy>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mutmut>=2.4",
    "locust>=2.29",
    "prometheus-client>=0.19",
    "ruff>=0.4",
    "bandit>=1.7",
]
monitoring = ["prometheus-client>=0.19"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # Use X | Y for union types (requires Python 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["ytaimbot_ml", "modules"]

# T-480: bandit security scan configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "htmlcov"]
skips = [
    "B101",  # assert statements (fine in tests)
    "B311",  # random (we use np.random.Generator per RULE-08)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# T-485: coverage settings — threshold raised to 90 once T-567–T-573 (P9) complete
addopts = "-q --tb=short --cov=src --cov=modules --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
