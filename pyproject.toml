[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytaimbot"
version = "0.1.0"
description = "YouTube AI Money Bot 2026 — autonomous trend analysis and content pipeline"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # Phase 1: Trend Adapters
    "httpx>=0.27,<1.0",
    "trendspy>=0.1.4",
    "google-api-python-client>=2.120,<3.0",
    # Phase 2: LLM + TTS
    "groq>=0.8.0",
    "edge-tts>=6.1.9",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
