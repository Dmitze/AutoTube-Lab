name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ modules/ tests/ --select E,W,F --ignore E501
      - name: Security scan (bandit)
        run: bandit -r src/ modules/ -ll -q
      - name: Run tests with coverage
        run: pytest -q --tb=short --cov=src --cov=modules --cov-report=term-missing --cov-report=xml
      - name: Mutation check (mutmut, non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          mutmut run --paths-to-mutate src/ytaimbot_ml/quality --runner "python -m pytest -q tests/test_bayes_filter.py tests/test_similarity_gate.py"
          mutmut results
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
