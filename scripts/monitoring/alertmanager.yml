# Alertmanager configuration (T-460)
# Sends alerts to Slack when pipeline misses daily run (>25h without execution)

global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-alerts"
  routes:
    - match:
        severity: critical
      receiver: "slack-critical"
      repeat_interval: 1h

receivers:
  - name: "slack-alerts"
    slack_configs:
      - channel: "${SLACK_CHANNEL_ALERTS:-#ytaimbot-alerts}"
        title: "⚠️ YTAIMBot Alert: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        send_resolved: true

  - name: "slack-critical"
    slack_configs:
      - channel: "${SLACK_CHANNEL_ALERTS:-#ytaimbot-alerts}"
        title: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
